name: Nightly snapshot

# Runs once per day during the measurement window, pulls every public data
# source, writes a hash-pinned snapshot into snapshots/ and commits it. The
# commit timestamp plus the on-chain manifest make the series auditable.
# Runs with the default GITHUB_TOKEN: no secrets needed.

on:
  schedule:
    - cron: "17 0 * * *" # daily at 00:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Fetch and pin today's snapshot
        run: pnpm snapshot
        env:
          CI: true
      - name: Commit snapshot if changed
        run: |
          git config user.name "popper-snapshot-bot"
          git config user.email "actions@github.com"
          git add snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "snapshot: $(date -u +%F) nightly data pin"
            git push
          fi
