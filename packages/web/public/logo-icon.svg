<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Popper logo">
  <!-- Popper: the open ring of falsification. A commitment ring that is
       deliberately incomplete: a thesis only means something if it can fail. -->
  <defs>
    <linearGradient id="pp-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00EC97"/>
      <stop offset="1" stop-color="#00B877"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#0A0A0A"/>
  <!-- outer commitment ring with a deliberate opening (the falsifiable gap) -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="url(#pp-green)" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="199 40" transform="rotate(-56 64 64)"/>
  <!-- measurement ticks on the ring -->
  <g stroke="#00EC97" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="64" y1="14" x2="64" y2="24"/>
    <line x1="64" y1="104" x2="64" y2="114"/>
    <line x1="14" y1="64" x2="24" y2="64"/>
    <line x1="104" y1="64" x2="114" y2="64"/>
  </g>
  <!-- inner dashed pre-registration ring -->
  <circle cx="64" cy="64" r="22" fill="none" stroke="#00EC97" stroke-width="2.5"
          stroke-dasharray="7 7" opacity="0.45"/>
  <!-- the thesis, held to account -->
  <circle cx="64" cy="64" r="9" fill="#00EC97"/>
</svg>
